name: tests

# Runs on every pull request, and on pushes to main so the main branch stays green.
# To block merging on failures: GitHub repo -> Settings -> Branches -> branch
# protection rule for `main` -> "Require status checks to pass" -> select "tests".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only ruff is needed (no project deps), so this job finishes in seconds.
      # Fix locally with:  ruff check --fix . && ruff format .
      - run: pip install -r requirements-lint.txt
      - run: ruff check .
      - run: ruff format --check .

  tests:
    # One job per OS: the app ships .bat and .command launchers, so users are on
    # Windows and macOS as well as Linux. NOTE: the check names are now
    # "tests (ubuntu-latest)" etc.; if you require "tests" in branch protection,
    # re-select these.
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as install.bat
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Byte-compile sources (catches syntax errors, incl. predict.py)
        run: python -m compileall -q GUI.py predict.py src tests

      # --with-deps installs system libraries via apt, which only applies on Linux.
      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright browser (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      # Coverage settings (source, omissions, minimum) live in pyproject.toml.
      - name: Run tests
        run: >
          python -m pytest -v
          --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --tracing retain-on-failure --output test-results

      - name: Coverage summary
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
