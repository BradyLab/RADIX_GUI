name: pip-audit

# Checks the pinned dependency versions against the public vulnerability databases
# (PyPI advisories / OSV). Everything in requirements.txt is pinned to an exact version
# that nobody updates by hand, so new CVEs would otherwise go unnoticed.
#
# Runs weekly (new advisories appear without any code change), on demand, and on PRs
# that touch the pins. A weekly failure means "an advisory now applies to a pinned
# version": open the run's summary for the package, ID and fixed version.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - install.bat
      - install_RADIX.command
      - .github/workflows/pip-audit.yml

permissions:
  contents: read

concurrency:
  group: pip-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On PRs the result is informational (a pre-existing advisory shouldn't block an
    # unrelated change); the scheduled run is the one that fails loudly.
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pip-audit==2.10.1

      # torch/torchvision/torchaudio are installed by install.bat / install_RADIX.command,
      # not listed in requirements.txt, so a requirements.txt scan alone would miss them.
      # Read the versions from install.bat so there is no second copy to keep in sync.
      - name: Build audit input (requirements.txt + pinned torch)
        shell: bash
        run: |
          ver() { sed -n "s/^set $1=\(.*\)/\1/p" install.bat | tr -d '\r'; }
          {
            echo "torch==$(ver TORCH_VERSION)"
            echo "torchvision==$(ver TORCHVISION_VERSION)"
            echo "torchaudio==$(ver TORCHAUDIO_VERSION)"
            cat requirements.txt
          } > audit-input.txt
          grep -E '^torch' audit-input.txt

      # Everything is pinned, so --no-deps/--disable-pip audits exactly these versions
      # without building an environment. Exit code 1 = vulnerabilities found.
      - name: Audit
        shell: bash
        run: |
          set +e
          pip-audit -r audit-input.txt --no-deps --disable-pip --timeout 120 \
            -f markdown -o audit.md
          status=$?
          {
            echo "### pip-audit"
            if [ -s audit.md ]; then cat audit.md; else echo "No known vulnerabilities."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
